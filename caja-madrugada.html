<title>Caja de Madrugada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: register screen in the style of a fast-food till — receipt column on the left, number row, size keys,
   category keys and a product grid in the middle, function keys (Void / Clear / Total) on the right.
   Deliberately single-theme (brushed-steel console), every colour set explicitly. */
:root{
  color-scheme:light;
  --steel:#b9bec4; --steel-hi:#d7dbdf; --steel-lo:#9aa0a7; --paper:#e9ece6; --ink:#15191d; --muted:#4f5862;
  --bar:#3a4048; --bar-ink:#e8edf2;
  --k-blue:#1f4f97; --k-red:#a3202a; --k-green:#2c7a2c; --k-teal:#7fb6b8; --k-gold:#d9b51c; --k-grey:#6c737b; --k-maroon:#6b1a1f;
  --ok:#1f7a2a; --warn:#a3202a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--steel-hi),var(--steel) 40%,var(--steel-lo));color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;min-height:100%}
*{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffd84a;outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--steel-lo);border-radius:4px;padding:8px 10px;min-width:0}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

/* status bar */
.status{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.cell{background:var(--bar);color:var(--bar-ink);border-radius:3px;padding:5px 10px;font-family:var(--mono);font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cell.title{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cell.ok{background:var(--ok)} .cell.warn{background:var(--warn)}
.spacer{flex:1}
nav{display:flex;gap:4px}
nav[hidden]{display:none}
@media (orientation:portrait) and (min-height:900px) and (min-width:700px){
  .np{grid-template-rows:auto auto repeat(6,minmax(96px,auto))}
  .ticket{min-height:420px}
}
nav button{border:0;border-radius:3px;background:var(--bar);color:var(--bar-ink);font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.05em;padding:5px 14px}
nav button[aria-selected="true"]{background:var(--k-gold);color:var(--ink)}

/* register */
.reg{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:8px}
.ticket{background:var(--paper);border:1px solid var(--steel-lo);border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 3px rgb(0 0 0/.15);display:flex;flex-direction:column;min-height:560px;font-family:var(--mono);font-size:14px}
.ticket .hd{display:flex;justify-content:space-between;background:#d4d8d0;padding:4px 8px;border-bottom:1px solid var(--steel-lo);font-size:12px}
.lines{list-style:none;margin:0;padding:4px 0;flex:1;overflow:auto;min-height:140px}
.lines li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px;padding:3px 8px;cursor:pointer;text-transform:uppercase}
.lines li[aria-selected="true"]{background:var(--k-blue);color:#fff}
.lines .nt{display:block;font-size:11px;padding-left:14px;opacity:.75}
.lines .empty{display:block;cursor:default;text-transform:none;color:var(--muted);font-family:var(--body);padding:16px 8px}
.tot{padding:6px 8px 8px 36px;border-top:1px dashed var(--steel-lo);display:grid;gap:1px}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-weight:600;font-size:16px}
.chg{margin:0 8px 8px;padding:10px;background:var(--ok);color:#fff;text-align:center;font-family:var(--display);font-size:30px;font-weight:700}
.foot{padding:6px 8px;border-top:1px solid var(--steel-lo);background:#d4d8d0;font-family:var(--body);font-size:12px;color:var(--muted)}

.panel{display:grid;gap:6px;min-width:0;align-content:start}
.digits{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.digit{aspect-ratio:1;max-height:62px;border-radius:50%;border:2px solid #8d949b;background:radial-gradient(circle at 35% 30%,#fff,#d9dde1 70%,#b7bdc3);
  font-family:var(--display);font-size:clamp(20px,3vw,34px);font-weight:700;color:#222;justify-self:center;width:100%;max-width:62px;padding:0}
.digit[aria-pressed="true"]{background:radial-gradient(circle at 35% 30%,#fff8cf,#ffd84a 70%,#c9a514)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px}
.col{display:flex;flex-direction:column;gap:6px}
.key{border:0;border-radius:5px;min-height:58px;padding:4px 5px;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.05;color:#fff;
  text-shadow:0 1px 1px rgb(0 0 0/.45);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000));
  box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 2px 0 rgb(0 0 0/.3);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.key:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgb(255 255 255/.2)}
.key small{font-family:var(--body);font-weight:500;font-size:12px;opacity:.95;text-shadow:none;margin-top:2px}
.key.dark-text{color:var(--ink);text-shadow:none}
.key.size{--c:var(--k-teal);color:var(--ink);text-shadow:none;font-size:30px}
.key.size small{font-size:11px}
.key[aria-pressed="true"]{outline:3px solid #ffd84a;outline-offset:1px}
.key:disabled{filter:grayscale(.7);opacity:.5;cursor:not-allowed}
.key.big{border-radius:50%;aspect-ratio:1;min-height:0;font-size:17px;margin-top:auto}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.cats .key{--c:var(--k-blue);min-height:50px}
.cats .key[aria-selected="true"]{--c:var(--k-gold);color:var(--ink);text-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;align-content:start}
.grid .key{min-height:64px}
.notice{background:var(--paper);border:1px dashed var(--steel-lo);padding:14px;color:var(--muted);border-radius:4px}

/* NP6-style category row: one key per menu, split in two when the menu has a second page */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(66px,1fr);gap:5px;overflow-x:auto;padding-bottom:2px}
.tab{display:flex;flex-direction:column;border:0;padding:0;font:inherit;cursor:pointer;border-radius:5px;min-height:50px;background:linear-gradient(180deg,#3d73c4,var(--k-blue) 55%,#163a70);box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 2px 0 rgb(0 0 0/.3)}
.tab .tc{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:600;font-size:13px;line-height:1;padding:3px 2px;text-shadow:0 1px 1px rgb(0 0 0/.5)}
.tab .tc[aria-current="true"]{color:#ffd84a;text-decoration:underline;text-underline-offset:2px}
.tab hr{margin:0 6px;border:0;border-top:1px solid rgb(255 255 255/.45)}
.tab.on{outline:3px solid #ffd84a;outline-offset:1px}
/* product tile: name band, picture, yellow price tag */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;align-content:start}
.tile{position:relative;display:flex;flex-direction:column;border:1px solid #7d848b;border-radius:3px;background:#fff;padding:0;min-height:82px;overflow:hidden;box-shadow:0 2px 0 rgb(0 0 0/.25)}
.tile:active{transform:translateY(1px)}
.tn{background:var(--c);color:var(--tc,#fff);font-family:var(--display);font-weight:600;font-size:12px;line-height:1.05;padding:2px 3px;min-height:2.3em;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.ti{flex:1;display:flex;align-items:center;justify-content:center;padding:2px 2px 13px;min-height:0}
.ti svg{width:48px;height:36px}
.np .ti svg{width:100%;height:100%;max-width:72px;max-height:52px;min-height:28px}
.tp{position:absolute;left:2px;bottom:2px;background:#ffe500;color:#111;font-family:var(--mono);font-weight:600;font-size:12px;padding:0 3px;line-height:1.3}
.np{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:auto auto repeat(6,minmax(64px,auto));gap:5px;min-width:0}
.np .digit{max-width:58px}
.np .tab{min-height:46px}
.np .tile,.np .key{min-height:0}
.key.size{--c:#e9c45a;position:relative;isolation:isolate;background:none;box-shadow:none;border-radius:0;color:var(--ink);text-shadow:none;font-size:27px;line-height:1}
.key.size::before{content:"";position:absolute;left:50%;top:50%;width:min(52px,82%);aspect-ratio:1;z-index:-1;transform:translate(-50%,-50%) rotate(45deg);border-radius:11px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000));box-shadow:1px 2px 2px rgb(0 0 0/.3),inset 0 1px 0 rgb(255 255 255/.5)}
.key.size small{font-size:9px}
.key.size[aria-pressed="true"]{--c:#1f5fbf;color:#fff;outline:none}
.key.size:focus-visible{outline:none}
.key.size:focus-visible::before{outline:3px solid #ffd84a;outline-offset:2px}
.key.size:disabled{filter:none;opacity:.8}
.key.round{border-radius:50%;aspect-ratio:1;align-self:center;justify-self:center;width:100%;max-width:80px;font-size:14px}
.npgrid{display:grid;grid-template-columns:62px repeat(8,minmax(0,1fr));gap:5px;min-width:0;align-content:start}
.npgrid .key.size{min-height:0}
.npgrid .tile{min-height:0}
.tile.off{filter:grayscale(1);opacity:.75;cursor:not-allowed}
.tile .cn{position:absolute;right:0;bottom:0;width:24px;height:20px;background:#fff;clip-path:polygon(100% 0,100% 100%,0 100%);color:#111;font-family:var(--display);font-weight:700;font-size:12px;line-height:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 2px 2px 0;box-sizing:border-box}
.tile .ua{position:absolute;right:2px;bottom:2px;background:#2b2b2b;color:#fff;font-family:var(--mono);font-size:8px;padding:0 3px;line-height:1.5}
.screen{display:grid;gap:12px;padding-bottom:20px}
.sc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sc-head h2{margin:0;font-family:var(--display);font-size:30px;text-transform:uppercase;letter-spacing:.04em}
.pill-n{background:var(--bar);color:var(--bar-ink);padding:4px 12px;border-radius:99px;font-family:var(--mono);font-size:14px}
.screen h3{margin:6px 0 0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-items:start}
.ocard{background:var(--paper);border:1px solid var(--steel-lo);border-top:7px solid var(--k-green);border-radius:8px;padding:10px;display:grid;gap:8px}
.ocard.warn{border-top-color:#E0A800}
.ocard.late{border-top-color:var(--k-red);box-shadow:0 0 0 2px var(--k-red)}
.ocard header{display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:13px}
.ocard header b{font-family:var(--display);font-size:24px}
.ocard .age{margin-left:auto;font-weight:600}
.ocard ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-family:var(--mono);font-size:15px;text-transform:uppercase}
.ocard li b{display:inline-block;min-width:22px}
.ocard li small{display:block;padding-left:22px;color:var(--muted);font-size:12px}
.ocard .key{min-height:54px;font-size:20px}
.ocards.small .ocard{opacity:.8;border-top-color:var(--steel-lo)}
.ocards.small .ocard ul{font-size:13px}
.sc-empty{background:var(--paper);border:1px dashed var(--steel-lo);border-radius:8px;padding:18px}
.rlist{display:grid;gap:4px}
.rrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--steel-lo);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
.rrow.done{opacity:.6}
.ticket .cur{flex:1;display:flex;flex-direction:column;min-height:0}
.ticket .hd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:#e4e6e2;font-family:var(--mono);font-size:12px;padding:3px 8px;border-bottom:1px solid var(--steel-lo)}
.ticket .hd span:nth-child(2){text-align:center}
.ticket .hd span:last-child{text-align:right}
.lines li[aria-selected="true"]{background:#000;color:#fff}
.lines li.child{padding-left:26px}
.lines .nt{opacity:.85}
.lines.small{font-size:12px}
.tot .chg2{color:#1f4fd8;font-size:18px;font-weight:600}
.tot .eos{justify-content:flex-start;color:var(--muted)}
.last{display:grid;grid-template-columns:minmax(0,1fr) 48px;border-top:2px solid var(--steel-lo);height:210px;background:#f2f3f1}
.last-body{overflow:auto;border-right:1px solid var(--steel-lo)}
.last-nav{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px;background:#d6d9dc;font-family:var(--mono);font-size:12px;text-align:center}
.last-nav .navb{border:1px solid #9aa0a7;background:linear-gradient(#fff,#d9dce0);border-radius:4px;font-size:20px;color:#1f3f8f;padding:4px 0}
.last-nav .navb:disabled{opacity:.4}
.last-nav .served{flex:1;border:1px solid #9aa0a7;background:linear-gradient(#fff,#d9dce0);border-radius:4px;color:#1f3f8f;font-family:var(--display);font-weight:700;font-size:16px;writing-mode:vertical-rl;letter-spacing:.06em}
.last-nav .served.on{background:var(--k-green);color:#fff}
.hidelast{border:0;border-top:1px solid var(--steel-lo);background:#e4e6e2;font-size:12px;text-align:left;padding:4px 8px;color:var(--muted)}
.outlist{flex:1;overflow:auto;padding:6px 10px;font-family:var(--mono);font-size:13px}
.outlist b{display:block;margin-top:6px;font-family:var(--body)}
.outlist ul{list-style:none;margin:2px 0 0;padding:0}
.muted{color:var(--muted)}
.sauce-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin-bottom:5px}
.sauce-row .tile{min-height:46px}
.sauce-row .tn{font-size:10px;min-height:0;padding:1px}
.np.compact{grid-template-rows:auto auto repeat(6,minmax(48px,auto))}
.np.compact .tile .ti svg{max-height:34px}
.np.compact .tab{min-height:38px}
.np.compact .digit{max-height:46px;max-width:46px}
.sauce-row .sn{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-weight:600;font-size:12px;line-height:1.05;padding:2px;color:#222}
.np.outage .tile{cursor:pointer}
.key.eqkey{--c:#f2b632;color:#111;text-shadow:none;font-size:12px;min-height:0}
.key.exitout{--c:#f4f4f4;color:#333;text-shadow:none;font-size:13px;min-height:0;border:1px solid #bbb}
.key.round.sf{max-width:66px;font-size:11px;line-height:1}
.overlay.steel{background:linear-gradient(180deg,#d7dbdf,#aeb4ba)}
.overlay.light{background:rgb(0 0 0/.15);align-items:flex-start}
.np-auth{position:relative;background:#fff;border-top:8px solid #ffbc0d;border-radius:6px;width:min(340px,100%);padding:22px 18px 18px;display:grid;gap:12px;box-shadow:0 10px 30px rgb(0 0 0/.3)}
.np-auth p{margin:0;text-align:center;font-weight:600;font-size:17px}
.np-first{display:block;text-align:center;color:#8a5a00;font-size:13px}
.np-x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:26px;color:#444}
.np-field{border:1px solid #bbb;height:52px;display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:.2em}
.np-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.np-keys button{height:62px;border:1px solid #ddd;border-radius:4px;background:#f7f7f7;font-family:var(--display);font-size:30px;font-weight:700}
.np-keys .g{background:#dcdcdc}
.np-keys .y{background:#ffbc0d;font-size:18px}
.np-menu{width:min(860px,100%);display:grid;gap:18px;justify-items:center}
.np-plate{margin:0;padding:6px 40px;background:linear-gradient(180deg,#f0f2f4,#9ea5ac);color:#5b636b;font-family:var(--display);font-size:clamp(26px,4vw,40px);text-shadow:0 1px 0 #fff;border-radius:4px}
.np-menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%}
.nb{min-height:76px;border:2px solid rgb(0 0 0/.25);border-radius:4px;font-family:var(--display);font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 1px rgb(0 0 0/.4);box-shadow:inset 0 1px 0 rgb(255 255 255/.3)}
.nb.red{background:linear-gradient(#e0484e,#b5121b)}
.nb.grey{background:linear-gradient(#9aa0a7,#6c737b)}
.nb.green{background:linear-gradient(#4caf50,#2c7a2c)}
.nb.blue{background:linear-gradient(#3d73c4,#1f4f97)}
.nb.black{background:linear-gradient(#333,#000)}
.np-restore{background:#c9ced3;border:1px solid #9aa0a7;width:min(1000px,100%);max-height:96vh;overflow:auto;padding:12px;display:grid;gap:10px}
.np-bar{margin:0;background:#9ea5ac;color:#fff;text-align:center;font-family:var(--body);font-size:18px;padding:6px}
.np-lbl{background:#eef0f2;border:1px solid #bbb;padding:6px 10px;font-size:13px;white-space:nowrap}
.np-cap{margin:0;text-align:center;font-size:13px;font-weight:600}
.rs-grid{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr) 90px;gap:8px;align-items:start}
.rs-box{background:#fff;border:1px solid #888;height:300px;overflow:auto}
.rs-box table{font-size:13px}
.rs-box th{background:#eee;position:sticky;top:0}
.rs-box tr[data-pick],.rs-box tr[data-unstage]{cursor:pointer}
.rs-box tr.pk td{background:#1f4f97;color:#fff}
.rs-mid{display:grid;gap:8px;padding-top:28px}
.np-equip{background:#fff;width:min(820px,100%);margin-top:40px;padding:16px;display:grid;gap:12px;border-radius:6px}
.np-equip h3{margin:0;font-family:var(--body);font-size:22px}
.eq-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.eq{position:relative;min-height:60px;border:1px solid #bbb;border-radius:6px;background:#f6f6f6;font-weight:600;font-size:17px}
.eq.on{border:3px solid #f2a900;background:#fff7e0}
.eq.on::after{content:"✓";position:absolute;right:4px;top:0;background:#f2a900;color:#fff;font-size:13px;padding:0 4px;border-radius:0 3px 0 4px}
@media (max-width:700px){.rs-grid{grid-template-columns:minmax(0,1fr)}.rs-mid{grid-auto-flow:column;padding:0}.eq-row{grid-template-columns:1fr 1fr}}
.npp{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(7,minmax(64px,1fr));gap:8px;min-height:calc(100vh - 70px);align-content:start}
.npp .np-plate{justify-self:center;align-self:center;margin:6px 0 10px}
.npb{border:2px solid rgb(0 0 0/.35);border-radius:3px;font-family:var(--display);font-weight:700;font-size:clamp(11px,1.35vw,16px);line-height:1.05;color:#fff;text-shadow:0 1px 1px rgb(0 0 0/.45);padding:4px;box-shadow:inset 0 1px 0 rgb(255 255 255/.25),0 2px 2px rgb(0 0 0/.25)}
.npb.olive{background:linear-gradient(#cbc84e,#9d9a2a)}
.npb.red{background:linear-gradient(#e2373f,#b81920)}
.npb.darkred{background:linear-gradient(#a31b22,#781116);font-size:clamp(10px,1.1vw,13px)}
.npb.grey{background:linear-gradient(#a2a8ae,#717880)}
.npb.blue{background:linear-gradient(#3b56e0,#1d33b4)}
.npb.cyan{background:linear-gradient(#7fdbe8,#3fb3c6);color:#123;text-shadow:none}
.npb.yellow{background:linear-gradient(#fff15a,#f2d400);color:#111;text-shadow:none}
.npb.orange{background:linear-gradient(#f9a240,#e07812)}
.npb.white{background:linear-gradient(#ffffff,#e4e4e4);color:#333;text-shadow:none;font-weight:600}
.npb.black{background:linear-gradient(#2a2a2a,#000)}
.npb.pill{background:linear-gradient(#ffffff,#dcdcdc);color:#222;text-shadow:none;border-radius:14px}
.npb .off{color:#e2373f}

<script>
(() => {
const STANDALONE = !!window.CM_STANDALONE;
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('cm.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('cm.'+k, JSON.stringify(v)); }catch(e){} }
};
const SIZES = { XS:'XS', S:'S', M:'M', L:'L', Mini:'Mini' };
const SZW = { S:'Sm', M:'Md', L:'Lg' };
const PALETTE = ['--k-red','--k-blue','--k-green','--k-gold','--k-maroon','--k-grey','--k-teal'];
const S = {
  view:'venta', db:null, mode:'loading',
  menu: LS.get('menu', []), sales: LS.get('sales', []), pending: LS.get('pending', []),
  taxRate: LS.get('taxRate', 6.625), mgrPin: LS.get('mgrPin', ''), mgrs: LS.get('mgrs', []), equip: LS.get('equip', {}), hideLast: LS.get('hideLast', false), lastIdx: 0, panel: null, outage: false, orderType: null, showPrices: LS.get('showPrices', true),
  order: [], sel: -1, cat: null, qty: '', size: null,
  tender: false, entry: '', done: null,
  regDate: today(), editId: null, confirmDel: null
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c)/100).toFixed(2);
const plain = c => (c/100).toFixed(2);
const toCents = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g,'')); return isFinite(n) ? Math.round(n*100) : 0; };
function today(d = new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function catColor(c){ const cats = categories(); const i = Math.max(0, cats.indexOf(c)); return `var(${PALETTE[i % PALETTE.length]})`; }

function lineAmt(l){ return l.promo ? 0 : l.price * (l.qty - (l.free || 0)); }
function calc(lines, rate){
  let sub = 0, taxable = 0;
  for (const l of lines){ const amt = lineAmt(l); sub += amt; if (l.taxable) taxable += amt; }
  const tax = Math.round(taxable * rate / 100);
  return { sub, tax, total: sub + tax };
}
function itemPrice(it, size){
  if (size && it.sizes && it.sizes[size]) return { price: it.sizes[size], size };
  return { price: it.price, size: it.sizes ? (it.defaultSize || null) : null };
}

/* ---------- sync ---------- */
function setSync(){
  const el = $('#sync');
  if (S.mode === 'cloud'){ el.className = 'cell ok'; el.textContent = S.pending.length ? `${S.pending.length} POR SUBIR` : 'GUARDADO'; }
  else if (S.mode === 'local'){ el.className = 'cell warn'; el.textContent = STANDALONE ? 'GUARDADO EN ESTE IPAD' : 'SOLO ESTE EQUIPO'; if (typeof CLOUD !== 'undefined' && CLOUD) updateCloudPill(); }
  else { el.className = 'cell'; el.textContent = 'CONECTANDO…'; }
  const n = mergedSales().filter(s => s.date === today()).length + 1;
  $('#ordno').textContent = 'ORDEN ' + String(n).padStart(3,'0');
}
function mergedSales(){
  const ids = new Set(S.sales.map(s => s.id));
  const all = S.sales.concat(S.pending.filter(p => !ids.has(p.id)));
  const have = new Set(all.map(s => s.id));
  return all.concat((S.cloud || []).filter(c => !have.has(c.id))).sort((a,b) => b.ts - a.ts);
}
async function flushPending(){
  if (!S.db || !S.pending.length) return;
  const left = [];
  for (const sale of S.pending){ try { await S.db.collection('sales').doc(sale.id).set(sale); } catch(e){ left.push(sale); } }
  S.pending = left; LS.set('pending', left); setSync();
}
async function saveSale(sale){
  if (STANDALONE) cloudPush('PUT', '/orders/' + sale.id, sale);
  if (S.db){ try { await S.db.collection('sales').doc(sale.id).set(sale); return; } catch(e){} }
  if (S.mode === 'cloud'){ S.pending.push(sale); LS.set('pending', S.pending); toast('Sin conexión: la venta se subirá después'); }
  else { S.sales.unshift(sale); LS.set('sales', S.sales); }
  setSync(); render();
}
async function patchSale(id, patch){
  if (STANDALONE){ cloudPush('PATCH', '/orders/' + id, patch); const c = (S.cloud || []).find(x => x.id === id); if (c) Object.assign(c, patch); }
  const local = S.pending.find(p => p.id === id);
  if (local){ Object.assign(local, patch); LS.set('pending', S.pending); render(); return; }
  if (S.db){ try { await S.db.collection('sales').doc(id).update(patch); } catch(e){ toast('No se pudo guardar el cambio. Revisa la conexión.'); } return; }
  const s = S.sales.find(x => x.id === id); if (s){ Object.assign(s, patch); LS.set('sales', S.sales); } render();
}
async function saveMenuItem(item){
  if (S.db){ try { await S.db.collection('menu').doc(item.id).set(item); return true; } catch(e){ toast('No se pudo guardar el producto.'); return false; } }
  const i = S.menu.findIndex(m => m.id === item.id); if (i >= 0) S.menu[i] = item; else S.menu.push(item);
  LS.set('menu', S.menu); return true;
}
async function deleteMenuItem(id){
  if (S.db){ try { await S.db.collection('menu').doc(id).delete(); } catch(e){ toast('No se pudo borrar.'); } return; }
  S.menu = S.menu.filter(m => m.id !== id); LS.set('menu', S.menu); render();
}
async function saveTax(rate){
  S.taxRate = rate; await saveSettings();
  render();
}
async function connect(){
  let db = null;
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch(e){ db = null; }
  if (!db){ S.mode = 'local'; setSync(); render(); return; }
  S.db = db; S.mode = 'cloud'; setSync();
  db.collection('menu').onSnapshot(snap => { S.menu = snap.docs.map(d => ({ id:d.id, ...d.data() })); LS.set('menu', S.menu); render(); },
    () => toast('No se pudo leer el menú.'));
  db.collection('sales').orderBy('ts','desc').limit(1000).onSnapshot(snap => {
    S.sales = snap.docs.map(d => ({ id:d.id, ...d.data() })); LS.set('sales', S.sales);
    const ids = new Set(S.sales.map(s => s.id));
    if (S.pending.some(p => ids.has(p.id))){ S.pending = S.pending.filter(p => !ids.has(p.id)); LS.set('pending', S.pending); }
    setSync(); render();
  }, () => toast('No se pudieron leer las ventas.'));
  db.doc('settings/config').onSnapshot(d => {
    if (d.exists && typeof d.data().taxRate === 'number'){ S.taxRate = d.data().taxRate; LS.set('taxRate', S.taxRate); }
    if (d.exists && d.data().mgrPin){ S.mgrPin = d.data().mgrPin; LS.set('mgrPin', S.mgrPin); }
    if (d.exists && Array.isArray(d.data().mgrs)){ S.mgrs = d.data().mgrs; LS.set('mgrs', S.mgrs); }
    if (d.exists && d.data().equip){ S.equip = d.data().equip; LS.set('equip', S.equip); }
    if (d.exists) render();
  });
  flushPending();
  window.addEventListener('online', flushPending);
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === S.view)));
  document.querySelector('nav').hidden = S.view === 'venta';
  const m = $('#main');
  if (S.screen){ document.querySelector('nav').hidden = true; m.innerHTML = viewProd(); return; }
  const keep = document.activeElement?.id;
  m.innerHTML = S.view === 'venta' ? viewVenta() : S.view === 'registro' ? viewRegistro() : viewMenu();
  if (keep && document.getElementById(keep) && S.view !== 'venta') document.getElementById(keep).focus();
}
function categories(){
  const seen = []; for (const it of S.menu){ const c = it.category || 'Otros'; if (!seen.includes(c)) seen.push(c); }
  return seen;
}
function ticketHtml(){
  normalizeSauces();
  const t = calc(S.order, S.taxRate);
  const d = S.done;
  const nextNum = mergedSales().filter(s => s.date === today()).length + 1;
  const rows = S.order.length ? displayOrder().map(([i, child]) => { const l = S.order[i]; const amt = lineAmt(l); return `
    <li data-line="${i}" class="${child ? 'child' : ''}" aria-selected="${i === S.sel}">
      <span class="num">${l.qty}</span><span>${esc(l.name)}${partsHtml(l)}${l.taxable ? '' : '<span class="nt">*SIN TAX</span>'}</span><span class="num">${amt ? plain(amt) : ''}</span>
    </li>`; }).join('')
    : d ? '' : `<li class="empty">Toca un producto. Para varios, toca primero el número (ej. 3 y luego el producto).</li>`;
  return `
  <section class="ticket" aria-label="Orden">
    <div class="cur">
      <div class="hd"><span>${esc((d && d.type) || S.orderType || 'OUT')}</span><span>Side1</span><span class="num">${d ? d.num : nextNum}</span></div>
      ${d ? `<ul class="lines">${saleLinesHtml(d)}</ul>
        <div class="tot num"><div><span>Sub Total</span><span>${plain(d.subtotal)}</span></div><div><span>Tax</span><span>${plain(d.tax)}</span></div>
        <div><span>Total ${esc((d.type || 'OUT').toLowerCase())}</span><span>${plain(d.total)}</span></div><div><span>Cash Tendered</span><span>${plain(d.paid)}</span></div>
        <div class="chg2"><span>Change</span><span>${plain(d.change)}</span></div><div><span>Order Id: ${d.num}</span></div><div class="eos">*** END OF SALE ***</div></div>
        <button class="btn go" data-act="receipt" style="margin:0 8px 8px;padding:8px">Mostrar recibo al cliente</button>`
      : `<ul class="lines">${rows}</ul>
        <div class="tot num"><div><span>Sub Total</span><span>${plain(t.sub)}</span></div><div><span>Tax</span><span>${plain(t.tax)}</span></div>
        <div class="g"><span>Total ${esc((S.orderType || 'OUT').toLowerCase())}</span><span>${plain(t.total)}</span></div></div>`}
    </div>
    ${lastSaleHtml()}
  </section>`;
}
function partsHtml(l){ return (l.parts || []).map(p => `<span class="nt">${/^\d/.test(p) || /PENDIENTE/.test(p) ? '' : (l.qty || 1) + ' '}${esc(p)}</span>`).join('') + (l.free ? `<span class="nt">${l.free} GRATIS (NUGGETS)</span>` : '') + (l.promo ? '<span class="nt">PROMO (MANAGER) $0.00</span>' : ''); }
function lineLabel(l){ return l.name + (l.parts && l.parts.length ? ' (' + l.parts.join(', ') + ')' : '') + (l.free ? ` (${l.free} gratis)` : '') + (l.promo ? ' (PROMO)' : ''); }
/* Nugget sauces: 4 or 6 pc = 1 free, 10 = 2, 20 = 3, 40 = 6; extra sauces are charged. */
const NUGGET_FREE = { 4:1, 6:1, 10:2, 20:3, 40:6 };
const SAUCE_RE = /bbq|sour|mustard|honey|ranch|buffalo|spicy pepper|ketchup|no sauce/i;
function freeSaucesFor(l){
  const it = S.menu.find(m => m.id === l.itemId); if (!it) return 0;
  if (it.nuggets) return (NUGGET_FREE[it.nuggets] || 0) * l.qty;
  const m = /(\d+)\s*(nugget|ngg)/i.exec(it.name || '');
  return m ? (NUGGET_FREE[+m[1]] || 0) * l.qty : 0;
}
function normalizeSauces(){
  let left = S.order.reduce((n, l) => n + freeSaucesFor(l), 0);
  for (const l of S.order){
    if (!l.sauce) continue;
    l.free = l.price > 0 ? Math.min(l.qty, left) : 0;
    left -= l.free;
  }
}
function viewVenta(){
  return `<div class="reg">${S.outage ? outageHtml() : ticketHtml()}<section class="panel">${S.tender ? tenderHtml() : S.panel === 'manager' ? managerPanelHtml() : S.panel === 'special' ? specialPanelHtml() : menuPanelHtml()}</section></div>`;
}
function tabGroups(){
  const cats = categories(), used = new Set(), groups = [];
  const base = c => c.replace(/\s+2$/, '');
  for (const c of cats){
    if (used.has(c)) continue;
    if (/\s2$/.test(c) && cats.includes(base(c))) continue;
    const two = cats.find(x => x !== c && /\s2$/.test(x) && base(x) === c);
    groups.push(two ? [c, two] : [c]); used.add(c); if (two) used.add(two);
  }
  for (const c of cats) if (!used.has(c)) groups.push([c]);
  return groups;
}
const DRINK_COLORS = [[/diet/,'#b9bcc0'],[/zero/,'#222'],[/coke/,'#c8102e'],[/sprite/,'#2e9e4f'],[/fanta|hi-c|orange/,'#f28c28'],[/pepper/,'#7a1f2b'],
  [/lemonade/,'#f2d64b'],[/tea/,'#a0522d'],[/water|dasani/,'#8ecae6'],[/apple/,'#e9c46a'],[/choc/,'#7b4a2a'],[/milk/,'#f4f4f4'],[/strawb|strwb/,'#f48fb1'],
  [/vanilla/,'#f3e5ab'],[/mango/,'#ffb347'],[/peach/,'#ffcba4'],[/blu/,'#3fa9f5'],[/cherry/,'#b0002a'],[/frozen/,'#c8102e'],[/mocha|frappe|coffee/,'#8b5a2b']];
function drinkColor(n){ for (const [re,c] of DRINK_COLORS) if (re.test(n)) return c; return '#5b8fd1'; }
/* ---------- Product drawings: each sandwich stacked with its real layers, drinks and sides drawn by type ---------- */
const PC = { bun:'#E2A057', bunHi:'#F4C887', bunCut:'#F6DDB0', seed:'#FFF6DC', patty:'#5A321F', pattyHi:'#7C4A2D', cheese:'#F8C421',
  lettuce:'#5EAE34', lettuceDk:'#3D8A21', tomato:'#DE3F2B', onion:'#F7F0DF', pickle:'#7C9A35', bacon:'#B3382A', baconFat:'#F2B8A5',
  eggW:'#FFFDF4', yolk:'#F6B415', fegg:'#F9D25B', ham:'#E88A8F', hamDk:'#C8636B', saus:'#8C5631', sausDk:'#6A3E1F',
  muffin:'#EFD5A2', muffinTop:'#C99A5C', biscuit:'#D99F57', biscuitHi:'#F1C887', griddle:'#A9682E', griddleHi:'#C98A4A',
  bagel:'#C88A48', bagelHi:'#E3AE6C', crispy:'#D9993C', crispyDk:'#A86E22', chick:'#E5AA55', fish:'#F4E6C2', fishEdge:'#D49A4C',
  steamed:'#F2DCAE', steamedHi:'#FBEBC8', potato:'#EFBF7E', potatoHi:'#FBDDAE', steak:'#6B3A22', sauce:'#F1A35C', spicy:'#E2471F', mayo:'#FFFFFF' };
const LAYER = {
  /* breads: [height, draw(y,h)] */

function removeChoice(ch){

  if (ch.kind === 'drink') changeOneUnit(idx, rebuildLine(l, null, null));
  else if (ch.kind === 'side'){ const tmp = { ...l, removed: [...(l.removed || []), ch.label] };
    const d = l.drinkId && S.menu.find(m => m.id === l.drinkId); changeOneUnit(idx, rebuildLine(tmp, d || null, l.drinkSize)); }
  else if (ch.kind === 'xfries'){ const d = l.drinkId && S.menu.find(m => m.id === l.drinkId); changeOneUnit(idx, rebuildLine({ ...l, extraFries: false }, d || null, l.drinkSize)); }
  else if (ch.kind === 'toy'){ const d = l.drinkId && S.menu.find(m => m.id === l.drinkId); changeOneUnit(idx, rebuildLine({ ...l, toy: null }, d || null, l.drinkSize)); }
  else if (ch.kind === 'sauce'){ const s = S.order[ch.idx]; if (s){ if (--s.qty <= 0){ S.order.splice(ch.idx, 1); if (S.sel > ch.idx) S.sel--; } } }
  render();
}
function clearChoice(btn){
  if (S.qty || S.size){ S.qty = ''; S.size = null; render(); return; }
  const l = S.sel >= 0 ? S.order[S.sel] : null;
  if (l){
    const opts = choicesFor(l);
    if (!opts.length) return;
    if (opts.length === 1){ removeChoice(opts[0]); toast('Quitado: ' + opts[0].label); return; }
    $('#layer').innerHTML = `
    <div class="overlay"><div class="dialog" role="dialog" aria-label="Clear Choice">
      <h3>Clear Choice · ${esc(l.name)}</h3>
      <p style="margin:0">¿Qué quieres quitar de la elección?</p>
      <div style="display:grid;gap:6px">${opts.map((o, i) => `<button class="key" style="--c:var(--k-red);min-height:52px;font-size:18px" data-clear="${i}">${esc(o.label)}</button>`).join('')}</div>
      <button class="btn" data-clear="cancel">Cancelar</button>
    </div></div>`;
    $('#layer').onclick = e => {
      const b = e.target.closest('[data-clear]'); if (!b) return;
      $('#layer').onclick = null; $('#layer').innerHTML = '';
      if (b.dataset.clear === 'cancel'){ render(); return; }
      removeChoice(opts[+b.dataset.clear]);
    };
    return;
  }
  if (btn.dataset.armed){ S.order = []; S.sel = -1; render(); }
  else { btn.dataset.armed = '1'; btn.innerHTML = '¿Borrar<br>orden?'; }
}

/* ---- Promo Item: a manager PIN sets the selected line to $0 ---- */
async function pinHash(p){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('cm-pin:' + p));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ return sha256Hex('cm-pin:' + p); }
}
/* Plain SHA-256 for pages that are not on a secure (https) connection, where crypto.subtle is missing. */
function sha256Hex(str){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str);
  const len = bytes.length, bitLen = len * 8;
  const total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 8, Math.floor(bitLen / 0x100000000)); dv.setUint32(total - 4, bitLen >>> 0);
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Uint32Array(64), rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < total; off += 64){
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++){
      const s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++){
      const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h = h.map((v, i) => (v + [a, b, c, d, e, f, g, hh][i]) >>> 0);
  }
  return h.map(v => v.toString(16).padStart(8, '0')).join('');
}

/* Wipe every saved sale (all dates) once they are in the real register. Two confirmations. */
function openWipe(){
  const all = mergedSales(); if (!all.length) return;
  const notIn = all.filter(s => !s.voided && !s.entered).length;
  const step = n => {
    $('#layer').innerHTML = n === 1 ? `
    <div class="overlay"><div class="dialog" role="dialog" aria-label="Borrar todo el registro">
      <h3>Borrar todo el registro</h3>
      <p style="margin:0">Se borrarán <b>${all.length}</b> ventas de todos los días.${notIn ? ` <b style="color:var(--warn)">${notIn} todavía no están marcadas como pasadas a la caja.</b>` : ' Todas están marcadas como pasadas a la caja.'}</p>
      <div class="row"><button class="btn" data-wipe="no">Cancelar</button><button class="btn no" data-wipe="1">Sí, borrar</button></div>
    </div></div>` : `
    <div class="overlay"><div class="dialog" role="dialog" aria-label="Confirmación final">
      <h3>¿Seguro? Última confirmación</h3>
      <p style="margin:0">Esto deja el registro en blanco y <b>no se puede deshacer</b>. Los productos, precios y el PIN no se borran.</p>
      <div class="row"><button class="btn" data-wipe="no">No, volver</button><button class="key" style="--c:var(--k-red);min-height:52px" data-wipe="2">Borrar todo definitivamente</button></div>
    </div></div>`;
  };
  step(1);
  $('#layer').onclick = async e => {
    const b = e.target.closest('[data-wipe]'); if (!b) return;
    if (b.dataset.wipe === 'no'){ $('#layer').onclick = null; $('#layer').innerHTML = ''; return; }
    if (b.dataset.wipe === '1'){ step(2); return; }
    $('#layer').onclick = null; $('#layer').innerHTML = '';
    S.pending = []; LS.set('pending', []); S.done = null;
    if (S.db){
      let failed = 0;
      for (const sale of S.sales.slice()){ try { await S.db.collection('sales').doc(sale.id).delete(); } catch(err){ failed++; } }
      if (failed) toast(`No se pudieron borrar ${failed} ventas. Revisa la conexión e inténtalo otra vez.`); else toast('Registro borrado.');
    } else { S.sales = []; LS.set('sales', []); if (STANDALONE){ cloudPush('DELETE', '/orders', null); S.cloud = []; } toast('Registro borrado.'); }
    setSync(); render();
  };
}
function saveFile(name, text, type){
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/* ---------- Cloud (iPad version on Cloudflare): orders shared through /api ---------- */
const CLOUD = STANDALONE && /^https?:$/.test(location.protocol);
S.cloud = []; S.cloudOk = null; S.screen = null;
let cloudQ = LS.get('cloudq', []), flushing = false;
async function api(path, method = 'GET', body){
  const r = await fetch('/api' + path, { method, credentials: 'same-origin', cache: 'no-store',
    headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw new Error('http ' + r.status);
  return r.json();
}
function updateCloudPill(){
  if (!CLOUD) return;
  const el = $('#sync');
  if (cloudQ.length){ el.className = 'cell warn'; el.textContent = `${cloudQ.length} POR SUBIR`; }
  else if (S.cloudOk === false){ el.className = 'cell warn'; el.textContent = 'SIN CONEXIÓN'; }
  else { el.className = 'cell ok'; el.textContent = 'EN LA NUBE'; }
}
/* Every change goes through a queue kept on the device, so nothing is lost while the internet is down. */
function cloudPush(method, path, body){ if (!CLOUD) return; cloudQ.push({ method, path, body }); LS.set('cloudq', cloudQ); flushCloud(); }
async function flushCloud(){
  if (!CLOUD){ return; }
  if (flushing || !cloudQ.length){ updateCloudPill(); return; }
  flushing = true;
  try {
    while (cloudQ.length){
      const job = cloudQ[0];
      try { await api(job.path, job.method, job.body); }
      catch(e){ if (!/^http (400|404|409|413)$/.test(e.message)) throw e; } /* a rejected job is dropped; a network failure stops and retries later */
      cloudQ.shift(); LS.set('cloudq', cloudQ);
    }
    S.cloudOk = true;
  } catch(e){ S.cloudOk = false; }
  flushing = false; updateCloudPill();
}
function startOfShift(){ const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() - 6 * 3600e3; }
async function refreshCloud(){
  if (!CLOUD) return;
  try {
    const since = S.screen ? startOfShift() : Date.now() - 31 * 864e5;
    S.cloud = await api('/orders?since=' + since); S.cloudOk = true;
  } catch(e){ S.cloudOk = false; }
  updateCloudPill();
  if (S.screen || S.view === 'registro') render();
}

function hhmm(ts){ return new Date(ts).toTimeString().slice(0, 5); }

  return (s.lines || []).map(l => `<li><span class="num">${l.qty}</span><span>${esc(l.name)}${partsHtml(l)}</span><span class="num">${lineAmt(l) ? plain(lineAmt(l)) : ''}</span></li>`).join('');

function lastSaleHtml(){
  if (S.hideLast) return `<button class="hidelast" data-act="togglelast">Click here to show last sale</button>`;
  const list = recentSales();
  if (!list.length) return `<div class="last"><div class="last-body"><p class="empty-p" style="padding:10px">Las órdenes cobradas salen aquí.</p></div></div><button class="hidelast" data-act="togglelast">Click here to hide last sale</button>`;
  S.lastIdx = Math.min(S.lastIdx || 0, list.length - 1);
  const s = list[S.lastIdx], served = s.status === 'ready';
  return `<div class="last">
      <div class="last-body"><div class="hd"><span>${esc(s.type || 'OUT')}</span><span>Side1</span><span class="num">${s.num || ''}</span></div><ul class="lines small">${saleLinesHtml(s)}</ul></div>

/* Manager: number, then password, on the NP6 keypad. Without managers set up yet, it lets you in and says so. */
function askManager(onOk){
  /* Always the keypad. With no manager saved yet, the first number + password typed become the first manager. */
  const firstTime = !S.mgrs.length;
  let step = 'num', num = '', val = '';
  const draw = () => {
    $('#layer').innerHTML = `
    <div class="overlay"><div class="np-auth" role="dialog" aria-label="Manager">
      <button class="np-x" data-k="x" aria-label="Cerrar">×</button>
      <p>Please enter Manager ${step === 'num' ? 'Number' : 'Password'} to authorize this operation.</p>
      ${firstTime ? `<small class="np-first">Primera vez: ${step === 'num' ? 'el número' : 'la contraseña (4 a 8 números)'} que escribas quedará guardado como tu manager.</small>` : ''}
      <div class="np-field num">${step === 'num' ? esc(val) : '•'.repeat(val.length)}</div>
      <div class="np-keys">${[7,8,9,4,5,6,1,2,3].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="b" class="g" aria-label="Borrar">&lt;</button><button data-k="0">0</button><button data-k="e" class="y">Enter</button></div>
    </div></div>`;
  };
  draw();
  $('#layer').onclick = async e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    const k = b.dataset.k;
    if (k === 'x'){ $('#layer').onclick = null; $('#layer').innerHTML = ''; return; }
    if (k === 'b'){ val = val.slice(0, -1); draw(); return; }
    if (k === 'e'){
      if (!val) return;
      if (step === 'num'){
        if (!firstTime && !S.mgrs.some(m => m.num === val)){ toast('Ese número de manager no existe.'); val = ''; draw(); return; }
        num = val; val = ''; step = 'pw'; draw(); return;
      }
      if (firstTime){
        if (!/^\d{4,8}$/.test(val)){ toast('La contraseña debe tener de 4 a 8 números.'); val = ''; draw(); return; }
        S.mgrs = [{ num, name: 'Manager', hash: await pinHash('mgr:' + num + ':' + val) }];
        await saveSettings(); toast(`Manager #${num} guardado.`);
        $('#layer').onclick = null; $('#layer').innerHTML = ''; onOk(S.mgrs[0]); return;
      }
      const m = S.mgrs.find(x => x.num === num);
      if ((await pinHash('mgr:' + num + ':' + val)) !== m.hash){ toast('Contraseña incorrecta.'); val = ''; draw(); return; }
      $('#layer').onclick = null; $('#layer').innerHTML = ''; onOk(m); return;
    }
    if (val.length < 10){ val += k; draw(); }
  };
}
function openManager(){ askManager(openManagerMenu); }

/* Restore / Remove: search, pick on the left, move them to the right, Ok applies. */
function openRestore(mode){
  const restoring = mode === 'restore';
  let q = '', picked = new Set(), staged = [];
  const pool = () => S.menu.filter(m => m.kind !== 'dummy' && !!m.off === restoring && !staged.includes(m.id)
      && (!q || ((m.name || '') + ' ' + (m.category || '')).toLowerCase().includes(q)))
    .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.name || '').localeCompare(b.name || ''));
  const row = (m, attr) => `<tr ${attr}="${esc(m.id)}" class="${picked.has(m.id) ? 'pk' : ''}"><td class="num">${esc(m.id)}</td><td>${esc(m.name)}</td><td>${esc(m.category || '')}</td></tr>`;
  const lists = () => {
    const left = pool();
    $('#rsLeft').innerHTML = left.length ? left.map(m => row(m, 'data-pick')).join('') : `<tr><td colspan="3" class="muted">${restoring ? 'No hay productos desactivados.' : 'Sin resultados.'}</td></tr>`;
    $('#rsRight').innerHTML = staged.map(id => S.menu.find(m => m.id === id)).filter(Boolean).map(m => row(m, 'data-unstage')).join('');
  };
  $('#layer').innerHTML = `
  <div class="overlay steel"><div class="np-restore" role="dialog" aria-label="${restoring ? 'Restore' : 'Remove'} Menu Item">
    <h2 class="np-bar">${restoring ? 'Restore' : 'Remove'} Menu Item</h2>
    <div class="row" style="flex-wrap:nowrap"><span class="np-lbl">Search Products</span><input id="rsQ" placeholder="Nombre del producto o pantalla" style="flex:1"></div>
    <div class="rs-grid">
      <div><p class="np-cap">${restoring ? 'Select Product(s) to Restore' : 'Select Product(s) to Remove'}</p><div class="rs-box"><table><thead><tr><th>Code</th><th>Menu item</th><th>Group</th></tr></thead><tbody id="rsLeft"></tbody></table></div></div>
      <div class="rs-mid"><button class="btn" data-rs="top">TOP</button><button class="btn" data-rs="move">Move<br>Selected &gt;</button><button class="btn" data-rs="all">Move All</button><button class="btn" data-rs="bottom">BOTTOM</button></div>
      <div><p class="np-cap">${restoring ? 'Restore Product(s)' : 'Remove Product(s)'}</p><div class="rs-box"><table><thead><tr><th>Code</th><th>Menu item</th><th>Group</th></tr></thead><tbody id="rsRight"></tbody></table></div></div>
      <div class="rs-mid"><button class="btn" data-rs="clearsel">Clear<br>Selected</button><button class="btn" data-rs="clearall">Clear All</button></div>
    </div>
    <p class="np-cap">Touch to select the menu item</p>
    <div class="row"><button class="btn go" data-rs="ok" style="font-size:18px">Ok</button><button class="btn" data-rs="cancel" style="font-size:18px">Cancel</button></div>
  </div></div>`;
  lists();
  $('#rsQ').oninput = e => { q = e.target.value.trim().toLowerCase(); lists(); };
  $('#layer').onclick = async e => {
    const tr = e.target.closest('[data-pick],[data-unstage]');
    if (tr){ const id = tr.dataset.pick || tr.dataset.unstage; picked.has(id) ? picked.delete(id) : picked.add(id); lists(); return; }
    const b = e.target.closest('[data-rs]'); if (!b) return;
    const k = b.dataset.rs;
    if (k === 'top') $('#rsLeft').closest('.rs-box').scrollTop = 0;
    if (k === 'bottom'){ const box = $('#rsLeft').closest('.rs-box'); box.scrollTop = box.scrollHeight; }
    if (k === 'move'){ for (const m of pool()) if (picked.has(m.id)){ staged.push(m.id); picked.delete(m.id); } lists(); }
    if (k === 'all'){ for (const m of pool()) staged.push(m.id); picked.clear(); lists(); }
    if (k === 'clearsel'){ staged = staged.filter(id => !picked.has(id)); picked.clear(); lists(); }
    if (k === 'clearall'){ staged = []; picked.clear(); lists(); }
    if (k === 'cancel'){ $('#layer').onclick = null; $('#layer').innerHTML = ''; return; }
    if (k === 'ok'){
      const items = staged.map(id => S.menu.find(m => m.id === id)).filter(Boolean);
      $('#layer').onclick = null; $('#layer').innerHTML = '';
      for (const it of items) await saveMenuItem({ ...it, off: !restoring });
      render();
      if (items.length) toast(`${items.length} producto(s) ${restoring ? 'disponibles otra vez' : 'quitados'}.`);
    }
  };
  setTimeout(() => $('#rsQ')?.focus(), 30);
}

function npAction(b){
  const a = b.dataset.np;
  if (a === 'key') return;
  if (a === NA){ toast(`${b.dataset.label}: no se usa en esta caja.`); return; }
  S.panel = null;
  if (a === 'return'){ render(); return; }
  if (a === 'reports'){ S.view = 'registro'; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'options' || a === 'managers'){ S.view = 'menu'; S.editId = null; render(); setTimeout(() => (a === 'managers' ? $('#mgrForm') : null)?.scrollIntoView({ block: 'center' }), 30); return; }
  if (a === 'remove' || a === 'restore'){ render(); openRestore(a); return; }
  if (a === 'prod'){ goScreen('prod'); return; }
  if (a === 'outage'){ S.outage = true; S.qty = ''; S.size = null; render(); return; }
  if (a === 'receipt'){ render(); const s = S.done || recentSales()[S.lastIdx || 0]; if (s) openReceipt(s); else toast('Todavía no hay ventas.'); }
}

function itemSummary(sales){
  const by = {};
  for (const s of sales) for (const l of s.lines){
    const nm = l.name + (l.parts && l.parts.length ? ' (' + l.parts.join(', ') + ')' : '') + (l.promo ? ' (PROMO)' : ''); const k = nm+'|'+l.price;
    const e = (by[k] ||= { name:nm, price:l.price, qty:0, amt:0 }); e.qty += l.qty; e.amt += lineAmt(l);
  }
  return Object.values(by).sort((a,b) => b.qty - a.qty);
}

  const e = S.menu.find(m => m.id === S.editId);
  const cats = categories();
  const sz = k => e?.sizes?.[k] ? plain(e.sizes[k]) : '';
  return `
  <div class="page">
    <div class="card">
      <h2>${e ? 'Editar producto' : 'Añadir producto'}</h2>
      <form id="itemForm" class="form" autocomplete="off">
        <label class="wide">Nombre (como sale en el ticket)<input id="f-name" required value="${esc(e?.name || '')}" placeholder="Ej. Café"></label>
        <label class="wide">Pantalla / categoría<input id="f-cat" list="catlist" value="${esc(e?.category || S.cat || '')}" placeholder="Ej. Desayuno"></label>
        <label>Precio normal<input id="f-price" inputmode="decimal" value="${e ? plain(e.price) : ''}" placeholder="0.00"></label>
        <label>o Small<input id="f-S" inputmode="decimal" value="${sz('S')}" placeholder="—"></label>
        <label>Medium<input id="f-M" inputmode="decimal" value="${sz('M')}" placeholder="—"></label>
        <label>Large<input id="f-L" inputmode="decimal" value="${sz('L')}" placeholder="—"></label>
        <div class="row" style="flex-wrap:nowrap">
          <label class="chk" style="color:var(--ink)"><input type="checkbox" id="f-tax" ${e ? (e.taxable ? 'checked' : '') : 'checked'}> Tax</label>
          <button class="btn go" type="submit">${e ? 'Guardar' : 'Añadir'}</button>
          ${e ? '<button class="btn" type="button" data-act="canceledit">Cancelar</button>' : ''}
        </div>
        <datalist id="catlist">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      </form>
      <p class="hint">El precio normal es el que se cobra si no tocas tamaño. Si el producto viene en Small / Medium / Large, pon esos precios también; en la venta toca S, M o L antes del producto, como en el NP6.</p>
    </div>
    <div class="two">
      <div class="card" style="align-content:start">
        <h2>Productos (${S.menu.length})</h2>
        <p class="hint">Quita la marca de <b>Disponible</b> para desactivar un producto: en la venta sale en gris con "UNAVAILABLE" y no se puede marcar.</p>
        ${S.menu.length ? `<div class="tbl"><table><thead><tr><th>Disponible</th><th>Producto</th><th class="r">Precio</th><th>Tax</th><th></th></tr></thead><tbody>
          ${cats.map(c => `<tr><th colspan="5">${esc(c)}</th></tr>` + S.menu.filter(i => (i.category||'Otros') === c).sort((a,b) => (a.name||'').localeCompare(b.name||'')).map(i => `
            <tr${i.off ? ' style="opacity:.6"' : ''}><td><label class="chk"><input type="checkbox" data-avail="${esc(i.id)}" ${i.off ? '' : 'checked'} aria-label="${esc(i.name)} disponible"></label></td><td>${esc(i.name)}${i.off ? ' <span class="tag">desactivado</span>' : ''}</td>
            <td class="r num">${i.price == null ? '—' : money(i.price)}${i.sizes ? '<br><small style="color:var(--muted)">' + Object.entries(i.sizes).filter(([,v]) => v).map(([k,v]) => `${k} ${money(v)}`).join(' · ') + '</small>' : ''}</td>
            <td>${i.taxable ? 'Sí' : '<span class="tag">No</span>'}</td>
            <td class="r" style="white-space:nowrap"><button class="btn" style="padding:3px 8px" data-edit="${esc(i.id)}">Editar</button>
            ${S.confirmDel === i.id ? `<button class="btn no" style="padding:3px 8px" data-del="${esc(i.id)}">¿Borrar?</button>` : `<button class="btn no" style="padding:3px 8px" data-askdel="${esc(i.id)}">Borrar</button>`}</td></tr>`).join('')).join('')}
        </tbody></table></div>` : '<p class="empty-p">Añade el primer producto arriba.</p>'}
      </div>
      <div class="card" style="align-content:start">
        <h2>Tax</h2>
        <form id="taxForm" class="row" autocomplete="off">
          <label>Tasa (%)<input id="f-rate" inputmode="decimal" value="${S.taxRate}"></label>
          <button class="btn go" type="submit" style="align-self:end">Guardar</button>
        </form>
        <p class="hint">New Jersey cobra 6.625% de sales tax sobre comida preparada y bebidas. Si un producto no lleva tax, desmárcalo. Confirma la tasa con tu gerente (algunas zonas UEZ cobran menos).</p>
      </div>
      <div class="card" style="align-content:start">
        <h2>Managers</h2>
        <p class="hint">Con <b>número</b> y <b>contraseña</b> se entra a Manager y se autoriza Promo Item, igual que en la caja.</p>
        ${S.mgrs.length ? `<div class="rlist">${S.mgrs.map(m => `<div class="rrow"><span>#${esc(m.num)}</span><span>${esc(m.name || 'Manager')}</span><button class="btn no" style="padding:2px 8px" data-delmgr="${esc(m.num)}">Borrar</button></div>`).join('')}</div>` : '<p class="empty-p">Todavía no hay managers.</p>'}
        <form id="mgrForm" class="row" autocomplete="off">
          <label>Número<input id="f-mnum" inputmode="numeric" maxlength="8" required></label>
          <label>Nombre<input id="f-mname" maxlength="30" placeholder="Opcional"></label>
          <label>Contraseña (4 a 8 números)<input id="f-mpw" type="password" inputmode="numeric" autocomplete="new-password" required></label>
          <button class="btn go" type="submit" style="align-self:end">Agregar</button>
        </form>
      </div>
    </div>
  </div>`;
}

/* ---------- actions ---------- */
function addItem(it){
  if (it.kind === 'dummy'){ toast(`${it.name}: este botón no se usa sin caja.`); return; }
  if (isOff(it)){ toast(`${it.name} no está disponible. Se activa en Manager → Restore Menu Item.`); return; }
  const qty = Math.max(1, parseInt(S.qty || '1', 10));
  if (S.size && (it.sizes || S.size === 'Mini') && !(it.sizes && it.sizes[S.size])){ toast(`${it.name} no tiene tamaño ${SIZES[S.size]}.`); return; }
  const p = itemPrice(it, S.size);
  if (p.price == null){ toast('Ese producto no tiene precio.'); return; }
  if (it.kind === 'happy'){ addLine(buildHappyLine(it, null, null, null), qty); return; }
  if (it.kind === 'hmside'){
    const sel = S.sel >= 0 ? S.order[S.sel] : null;
    const idx = sel && sel.mealType === 'happy' && !sel.extraFries ? S.sel : S.order.findIndex(l => l.mealType === 'happy' && !l.extraFries);
    if (idx < 0){ toast('Primero pon un Happy Meal.'); return; }
    const l = S.order[idx]; const d = l.drinkId && S.menu.find(m => m.id === l.drinkId);
    changeOneUnit(idx, rebuildLine({ ...l, extraFries: true, removed: (l.removed || []).filter(p => p !== 'APPLE SLICES') }, d || null, l.drinkSize));
    S.done = null; S.qty = ''; S.size = null; render(); return;
  }
  if (it.kind === 'toy'){
    for (let n = 0; n < qty; n++){ const idx = toyIndex(); if (idx < 0){ if (!n) toast('Primero pon un Happy Meal.'); break; } setToy(idx, it.name.toUpperCase()); }
    S.done = null; S.qty = ''; S.size = null; render(); return;
  }
  if (it.meal && p.size && it.sizes && it.sizes[p.size] && (S.size || it.alwaysMeal)){ addLine(buildMealLine(it, p.size, null), qty); return; }
  if (isDrink(it) && pendingIndex() >= 0){
    for (let n = 0; n < qty; n++){ const idx = pendingIndex(); if (idx < 0){ addLine({ name: (p.size ? SIZES[p.size] + ' ' : '') + it.name, price: p.price, taxable: !!it.taxable, itemId: it.id, size: p.size }, qty - n); return; } assignDrink(idx, it, p.size); }
    S.done = null; S.qty = ''; S.size = null; render(); return;
  }
  const name = (p.size ? SIZES[p.size] + ' ' : '') + it.name;
  const sauce = /^condiments$/i.test(it.category || '') && SAUCE_RE.test(it.name || '');
  let owner = null;
  if (sauce){
    const sel = S.sel >= 0 ? S.order[S.sel] : null;
    const target = sel && !sel.sauce && freeSaucesFor(sel) > 0 ? sel : [...S.order].reverse().find(l => !l.sauce && freeSaucesFor(l) > 0);
    owner = target ? target.key : null;
  }
  addLine({ name, price: p.price, taxable: !!it.taxable, itemId: it.id, size: p.size, ...(it.includes && it.includes.length ? { parts: it.includes.slice() } : {}), ...(sauce ? { sauce: true, for: owner } : {}) }, qty);
}
function addLine(it, qty = 1){
  S.done = null;
  const pk = JSON.stringify(it.parts || []);
  const i = S.order.findIndex(l => l.name === it.name && l.price === it.price && l.taxable === it.taxable && JSON.stringify(l.parts || []) === pk && (l.for || null) === (it.for || null) && !l.promo);
  if (i >= 0){ S.order[i].qty += qty; S.sel = i; } else { S.order.push({ ...it, qty, key: uid() }); S.sel = S.order.length - 1; }
  S.qty = ''; S.size = null; render();
}
async function finishSale(paid){
  normalizeSauces();
  const t = calc(S.order, S.taxRate);
  if (paid < t.total) return;
  const now = new Date();
  const sale = { id: uid(), ts: now.getTime(), date: today(now), time: now.toTimeString().slice(0,5),
    lines: S.order.map(l => ({ name:l.name, price:l.price, qty:l.qty, taxable:!!l.taxable, ...(l.parts ? { parts:l.parts } : {}), ...(l.free ? { free:l.free } : {}), ...(l.promo ? { promo:true } : {}) })),
    num: mergedSales().filter(s => s.date === today(now)).length + 1, type: S.orderType || 'OUT',
    subtotal: t.sub, tax: t.tax, total: t.total, paid, change: paid - t.total, taxRate: S.taxRate, entered:false, voided:false };
  S.done = sale; S.order = []; S.sel = -1; S.tender = false; S.entry = ''; S.orderType = null; S.lastIdx = 0;
  render();
  await saveSale(sale);
}
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b){ S.view = b.dataset.view; S.editId = null; S.confirmDel = null; render(); } });
$('#main').addEventListener('click', async e => {
  const t = e.target;
  const g = sel => t.closest(sel);
  let b;
  if ((b = g('[data-ready]'))){ setOrderStatus(b.dataset.ready, 'ready'); return; }
  if ((b = g('[data-unready]'))){ setOrderStatus(b.dataset.unready, 'new'); return; }
  if ((b = g('[data-line]'))){ const i = +b.dataset.line; S.sel = S.sel === i ? -1 : i; render(); return; }
  if ((b = g('[data-digit]'))){ S.done = null; S.qty = (S.qty + b.dataset.digit).replace(/^0+/, '').slice(0,2); render(); return; }
  if ((b = g('[data-size]'))){ S.size = S.size === b.dataset.size ? null : b.dataset.size; render(); return; }
  if ((b = g('[data-tabg]'))){ const grp = allTabs()[+b.dataset.tabg] || []; const i = grp.indexOf(S.cat); S.cat = i < 0 ? grp[0] : grp[(i + 1) % grp.length]; render(); return; }
  if ((b = g('[data-cat]'))){ S.cat = b.dataset.cat; render(); return; }
  if ((b = g('[data-np]'))){ npAction(b); return; }
  if ((b = g('[data-delmgr]'))){ if (b.dataset.armed){ S.mgrs = S.mgrs.filter(m => m.num !== b.dataset.delmgr); if (await saveSettings()) render(); } else { b.dataset.armed = '1'; b.textContent = '¿Borrar?'; } return; }
  if ((b = g('[data-item]')) && S.outage){ const it = S.menu.find(m => m.id === b.dataset.item); if (it) await toggleOutage(it); return; }
  if ((b = g('[data-item]'))){ const it = S.menu.find(m => m.id === b.dataset.item); if (it){ if (b.dataset.fsize && !S.size) S.size = b.dataset.fsize; addItem(it); } return; }
  if ((b = g('[data-pad]'))){ const v = b.dataset.pad; S.entry = v === 'clear' ? '' : (S.entry + v).replace(/^0+/, '').slice(0,7); render(); return; }
  if ((b = g('[data-cash]'))){ const v = b.dataset.cash; await finishSale(v === 'entry' ? parseInt(S.entry || '0', 10) : Number(v)); return; }
  if ((b = g('[data-edit]'))){ S.editId = b.dataset.edit; S.confirmDel = null; render(); window.scrollTo({ top:0 }); return; }
  if ((b = g('[data-askdel]'))){ S.confirmDel = b.dataset.askdel; render(); return; }
  if ((b = g('[data-del]'))){ const id = b.dataset.del; S.confirmDel = null; if (S.editId === id) S.editId = null; await deleteMenuItem(id); return; }
  if ((b = g('[data-receipt]'))){ openReceipt(mergedSales().find(s => s.id === b.dataset.receipt)); return; }
  if ((b = g('[data-void]'))){ if (b.dataset.armed){ await patchSale(b.dataset.void, { voided:true }); } else { b.dataset.armed = '1'; b.textContent = '¿Anular? toca otra vez'; } return; }
  if (!(b = g('[data-act]'))) return;
  const act = b.dataset.act;
  if (act === 'void' && S.sel >= 0){
    /* void the selected line (and the sauces that hang from it), then select the next line, or the previous one at the end */
    const pos = displayOrder().findIndex(([i]) => i === S.sel);
    const gone = S.order[S.sel];
    S.order = S.order.filter(l => l !== gone && !(l.sauce && gone.key && l.for === gone.key));
    const rows = displayOrder();
    S.sel = rows.length ? rows[Math.min(Math.max(pos, 0), rows.length - 1)][0] : -1;
    render();
  }
  if (act === 'clear') clearChoice(b);
  if (act === 'prices'){ S.showPrices = !S.showPrices; LS.set('showPrices', S.showPrices); render(); }
  if (act === 'total' && S.order.length){ S.orderType = b.dataset.type || 'OUT'; openPendingPicker(); }
  if (act === 'special') openSpecial();
  if (act === 'exitoutage'){ S.outage = false; render(); }
  if (act === 'equipment') openEquipment();
  if (act === 'togglelast'){ S.hideLast = !S.hideLast; LS.set('hideLast', S.hideLast); render(); }
  if (act === 'lastolder'){ S.lastIdx = (S.lastIdx || 0) + 1; render(); }
  if (act === 'lastnewer'){ S.lastIdx = Math.max(0, (S.lastIdx || 0) - 1); render(); }
  if (act === 'served'){ const sv = recentSales().find(x => x.id === b.dataset.sid); if (sv) await patchSale(sv.id, { status: sv.status === 'ready' ? 'new' : 'ready' }); render(); }
  if (act === 'modify'){ S.tender = false; render(); }
  if (act === 'changemeal') openChangeMeal();
  if (act === 'promo') openPromo();
  if (act === 'toprod') goScreen('prod');
  if (act === 'tocaja'){ S.view = 'venta'; goScreen(null); }
  if (act === 'csv') exportCsv();
  if (act === 'wipe') openWipe();
  if (act === 'backup') exportBackup();
  if (act === 'receipt') openReceipt(S.done);
  if (act === 'manager') openManager();
  if (act === 'canceledit'){ S.editId = null; render(); }
  if (act === 'copy'){
    const live = mergedSales().filter(s => s.date === S.regDate && !s.voided);
    const tot = live.reduce((x,s) => x + s.total, 0), tax = live.reduce((x,s) => x + s.tax, 0);
    const txt = `Ventas en efectivo sin caja ${S.regDate}\n` + itemSummary(live).map(i => `${i.qty} x ${i.name} (${money(i.price)})`).join('\n') +
      `\nVentas: ${live.length}\nTax: ${money(tax)}\nTotal efectivo: ${money(tot)}`;
    try { await navigator.clipboard.writeText(txt); toast('Resumen copiado'); } catch(err){ toast('No se pudo copiar automáticamente.'); }
  }
});
$('#main').addEventListener('change', e => {
  if (e.target.id === 'regDate'){ S.regDate = e.target.value || today(); render(); }
  if (e.target.dataset.entered) patchSale(e.target.dataset.entered, { entered: e.target.checked });
  if (e.target.dataset.avail){
    const it = S.menu.find(m => m.id === e.target.dataset.avail);
    if (it){ const next = { ...it, off: !e.target.checked };
      saveMenuItem(next).then(ok => { if (ok){ if (!S.db){ render(); } toast(next.off ? `${it.name} desactivado` : `${it.name} activado`); } }); }
  }
});
$('#main').addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'itemForm'){
    const name = $('#f-name').value.trim();
    const sizes = {}; for (const k of ['S','M','L']){ const c = toCents($('#f-'+k).value); if (c) sizes[k] = c; }
    const price = toCents($('#f-price').value);
    if (!name || (!price && !Object.keys(sizes).length)){ toast('Escribe el nombre y al menos un precio.'); return; }
    const old = S.menu.find(m => m.id === S.editId);
    const item = { ...(old || {}), id: S.editId || uid(), name, category: $('#f-cat').value.trim() || 'Otros', taxable: $('#f-tax').checked };
    if (/lunch|combo|mcvalue|breakfast/i.test(item.category) && (sizes.M || sizes.L)) item.meal = true;
    if (Object.keys(sizes).length){
      item.sizes = sizes; item.price = price || sizes.M || Object.values(sizes)[0];
      item.defaultSize = Object.keys(sizes).find(k => sizes[k] === item.price) || null;
    } else { delete item.sizes; delete item.defaultSize; item.price = price; }
    const wasEdit = !!S.editId;
    if (await saveMenuItem(item)){ toast(wasEdit ? 'Producto guardado' : 'Producto añadido'); S.editId = null; S.cat = item.category; render(); $('#f-name')?.focus(); }
  }
  if (e.target.id === 'mgrForm'){
    const num = $('#f-mnum').value.trim(), pw = $('#f-mpw').value.trim(), name = $('#f-mname').value.trim();
    if (!/^\d{1,8}$/.test(num)){ toast('El número de manager debe ser solo números.'); return; }
    if (!/^\d{4,8}$/.test(pw)){ toast('La contraseña debe tener de 4 a 8 números.'); return; }
    S.mgrs = S.mgrs.filter(m => m.num !== num).concat([{ num, name, hash: await pinHash('mgr:' + num + ':' + pw) }]);
    if (await saveSettings()){ toast('Manager guardado'); render(); }
  }
  if (e.target.id === 'pinForm'){
    const p = $('#f-pin').value.trim();
    if (!/^\d{4,8}$/.test(p)){ toast('El PIN debe tener de 4 a 8 números.'); return; }
    S.mgrPin = await pinHash(p); if (await saveSettings()){ toast('PIN guardado'); render(); }
  }
  if (e.target.id === 'taxForm'){
    const r = parseFloat($('#f-rate').value); if (!(r >= 0 && r < 30)){ toast('Escribe una tasa entre 0 y 30.'); return; }
    await saveTax(r); toast('Tax guardado');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer').innerHTML && !$('#lockForm')) $('#layer').innerHTML = ''; });

function tick(){ const d = new Date(); $('#clock').textContent = d.toTimeString().slice(0,5); }
tick(); setInterval(tick, 15000);
setSync(); render(); connect();
if (STANDALONE){
  window.addEventListener('hashchange', route);
  window.addEventListener('online', flushCloud);
  setInterval(() => { if (document.hidden) return; flushCloud(); if (S.screen || S.view === 'registro') refreshCloud(); }, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ flushCloud(); if (S.screen || S.view === 'registro') refreshCloud(); } });
  route();
  lockScreen();
}
})();
</script>
